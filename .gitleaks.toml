# baseline-version: 1
# repo-baseline:canonical-begin
title = "repo-baseline"
minVersion = "v8.30.1"

[extend]
useDefault = true

# The upstream Hugging Face detector accepts letters only. Real tokens are alphanumeric.
[[rules]]
id = "repo-baseline-huggingface-pat"
description = "Hugging Face access token"
regex = '''hf_[A-Za-z0-9]{34,40}'''
keywords = ["hf_"]

# Gitleaks v8.30.1 has no Modrinth detector.
[[rules]]
id = "repo-baseline-modrinth-pat"
description = "Modrinth personal access token"
regex = '''mrp_[A-Za-z0-9]{50,}'''
keywords = ["mrp_"]

# Upstream covers sk-ant-api03 keys, but not Claude OAuth/session token prefixes.
[[rules]]
id = "repo-baseline-anthropic-oauth"
description = "Anthropic OAuth or session token"
regex = '''sk-ant-(?:oat|sid)[0-9]{2}-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-oat", "sk-ant-sid"]

# Python bytecode only repeats constants derived from source and produces binary false positives.
[[allowlists]]
description = "Regenerable Python bytecode caches"
paths = ['''(^|/)__pycache__(/|$)''']
# repo-baseline:canonical-end

# Add repository-specific exceptions below this line. Prefer targeted [[allowlists]]
# entries or .gitleaksignore fingerprints over broad global exclusions.
